name: cupcake
team: cupcake

compute:
  cpu: 256
  memory: 512
  port: 3000
  health_check: /health

routing:
  host: cupcake.javazone.no
  priority: 100

auth:
  pool: internal
  client: public
  callback_urls:
    - https://cupcake.javazone.no/
    - https://cupcake.javazone.no/auth/callback
    - http://localhost:3000/
  logout_urls:
    - https://cupcake.javazone.no/
    - http://localhost:3000/
  groups:
    - helter
  env:
    COGNITO_CLIENT_ID: NUXT_PUBLIC_OIDC_CLIENT_ID
    COGNITO_ISSUER_URL: NUXT_PUBLIC_OIDC_AUTHORITY
    COGNITO_DOMAIN: NUXT_PUBLIC_OIDC_LOGOUT_DOMAIN
    COGNITO_IDENTITY_PROVIDER: NUXT_PUBLIC_OIDC_IDENTITY_PROVIDER

environment:
  CUPCAKE_BACKEND: https://cupcake-backend.javazone.no
